  <line x1="52" y1="67" x2="52" y2="71" stroke="#c8a45c" stroke-width="0.6" opacity="0.4"/>
  <line x1="56" y1="67" x2="56" y2="71" stroke="#c8a45c" stroke-width="0.6" opacity="0.4"/>
  <line x1="60" y1="67" x2="60" y2="71" stroke="#c8a45c" stroke-width="0.6" opacity="0.4"/>
  <line x1="64" y1="67" x2="64" y2="71" stroke="#c8a45c" stroke-width="0.6" opacity="0.4"/>
  <line x1="68" y1="67" x2="68" y2="71" stroke="#c8a45c" stroke-width="0.6" opacity="0.4"/>

